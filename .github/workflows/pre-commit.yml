name: Pre-Commit

on:
  workflow_call:

env:
  PYTHON_VERSION: ${{ vars.PYTHON_VERSION || '3.11' }}

defaults:
  run:
    shell: bash

jobs:
  pre-commit:
    name: Format & Quality Checks
    runs-on: ${{ vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install UV & Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync Dependency Group (check)
        run: uv sync --locked --group check

      - name: Run Pre-Commit
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Run Quality
        run: chmod +x ./scripts/quality.sh && ./scripts/quality.sh
